# Photobooth MVP pre-release workflow.
# Trigger: push a v* tag (e.g. v0.1.0-mvp) that points to a tested commit on main.
# Builds an Android DEBUG APK and an UNSIGNED Windows installer.
# Before production distribution, add persistent Android release signing and Windows code signing.
name: Build and publish Photobooth prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install project Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7 (matches local working script)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK without a persistent Gradle daemon
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare Android release asset
        shell: bash
        run: |
          mkdir -p release-assets
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Photobooth-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: release-assets/Photobooth-android-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer (Inno Setup)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET SDK (compiles existing net8.0 projects)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish backend and Windows admin
        shell: pwsh
        run: .\build-windows.ps1

      # windows-2022 includes Inno Setup 6. Your installer/photobooth.iss
      # must reference the files published into dist/app and dist/admin.
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/O$out" '/FPhotoboothSetup' 'installer\photobooth.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'PhotoboothSetup.exe'))) {
            throw 'The expected PhotoboothSetup.exe was not produced.'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: release-installer/PhotoboothSetup.exe
          if-no-files-found: error

  publish:
    name: Create GitHub prerelease
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub prerelease with downloadable assets
        uses: softprops/action-gh-release@v3
        with:
          name: Photobooth ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Photobooth-android-debug.apk
            release-assets/PhotoboothSetup.exe
